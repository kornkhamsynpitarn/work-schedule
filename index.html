<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Work Schedule – Syn Pitarn (SMSK) Branch</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A3D;--paper:#F5F2EA;--card:#fff;--rule:#EEE8D8;--slate:#76808F;--teal:#2F6F62;--brass:#A67C3D;--wk:#FAF8F2;--rust:#B14A2C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--ink:#E8E4D8;--paper:#121A25;--card:#1A2533;--rule:#2A3849;--slate:#98A5B6;--teal:#6FB7A5;--brass:#D1A663;--wk:#1E2B3B;--rust:#E08A6D}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
main{padding:20px;max-width:1280px;margin:0 auto}
header{margin-bottom:16px}
h1{font:600 22px Fraunces,Georgia,serif;margin:0}
header p{margin:2px 0 0;color:var(--slate);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.ttl{display:flex;align-items:center;gap:6px}
h2{font:600 18px Fraunces,Georgia,serif;margin:0 6px;min-width:150px;text-align:center}
button,select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:7px 12px}
button{font-weight:500;cursor:pointer}
button.ic{width:34px;height:34px;padding:0;font-size:18px;line-height:1;border-radius:50%}
button:hover{border-color:var(--brass)}
button.pri{background:var(--teal);border-color:var(--teal);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
select{padding:7px 8px}
.sp{flex:1}
#q{min-width:170px}
.info{display:flex;flex-wrap:wrap;gap:6px 8px;margin-bottom:12px}
.info:empty{display:none}
.info span{font-size:12.5px;color:var(--slate);background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:3px 11px}
.info span.lb{color:var(--teal);font-weight:600;background:transparent;border-color:transparent;padding-left:0}
.wrap{overflow:auto;max-height:74vh;border-radius:16px;background:var(--card);box-shadow:0 1px 3px rgba(20,30,50,.08),0 8px 24px rgba(20,30,50,.05)}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{padding:0;text-align:center;height:50px;min-width:46px;border-bottom:1px solid var(--rule)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--teal) 5%,var(--card))}
thead th{position:sticky;top:0;z-index:3;background:var(--card);height:56px;font-weight:500;color:var(--slate)}
thead th span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
thead th b{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:50%;font-size:13px;color:var(--ink);font-weight:600}
th.we span{color:var(--rust)}
th.tc b{background:var(--teal);color:#fff}
td.we{background:var(--wk)}
td.tc{background:color-mix(in srgb,var(--teal) 7%,transparent)}
.nm{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;padding:0 14px 0 12px;min-width:170px;box-shadow:1px 0 0 var(--rule)}
thead .nm{z-index:4;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.who{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,var(--card));flex:none}
.who b{display:block;font-weight:600;line-height:1.2;color:var(--ink)}
.who small{display:block;font-size:11px;color:var(--slate);letter-spacing:.02em}
tr.me .nm{box-shadow:inset 4px 0 0 var(--teal),1px 0 0 var(--rule)}
tr.me .av{background:var(--teal);color:#fff}
td.c{position:relative}
.chip{--c:#ccc;display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:34px;height:28px;padding:0 8px;border-radius:9px;font-size:11.5px;font-weight:600;letter-spacing:.02em;background:var(--c);color:#1a1a1a;background:color-mix(in srgb,var(--c) 38%,var(--card));color:color-mix(in srgb,var(--c) 25%,var(--ink))}
.chip i{font-style:normal;font-size:9px;font-weight:700;padding:1px 4px;border-radius:5px;background:var(--ink);color:var(--card)}
.chip.ot{--c:#888;min-width:30px}
td.nt::after{content:"";position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--brass)}
.ed td.c,.vw td.c.has{cursor:pointer}
.ed td.c:hover{box-shadow:inset 0 0 0 2px var(--brass);border-radius:6px}
.leg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;font-size:12.5px;color:var(--slate);align-items:center}
.leg span{display:inline-flex;align-items:center;gap:6px}
.msg{padding:40px;text-align:center;color:var(--slate)}
#ov{position:fixed;inset:0;background:rgba(10,18,30,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#ov[hidden]{display:none}
#pop{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:370px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#pop h3{margin:0 0 12px;font:600 17px Fraunces,Georgia,serif}
#pi{margin:0 0 14px;color:var(--ink)}
#pc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#pc button{min-width:48px;padding:6px 8px;border-radius:10px}
#pc button.on{outline:3px solid var(--brass);outline-offset:1px}
#pop label{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:13px}
#pn{width:100%;margin-bottom:14px}
.act{display:flex;gap:8px;justify-content:flex-end}
#pe{color:var(--rust);font-size:12px;margin:8px 0 0}
@media(max-width:600px){main{padding:12px}.nm{min-width:128px}.av{display:none}th,td{min-width:42px}}
</style></head>
<body>
<main>
  <header id="hd"><h1>Work Schedule</h1><p>Syn Pitarn (SMSK) Branch</p></header>
  <div class="bar">
    <div class="ttl"><button class="ic" id="prev" aria-label="Previous month">‹</button><h2 id="ttl"></h2><button class="ic" id="next" aria-label="Next month">›</button></div>
    <button id="tod">Today</button>
    <select id="mo" aria-label="Month"></select><select id="yr" aria-label="Year"><option>2026</option><option>2027</option></select>
    <span class="sp"></span><input id="q" type="search" placeholder="Find a name…" aria-label="Find a name">
  </div>
  <div class="info" id="off"></div>
  <div class="info" id="ev"></div>
  <div class="wrap" id="grid"></div>
  <div class="leg" id="leg"></div>
</main>
<div id="ov" hidden><div id="pop" role="dialog" aria-modal="true">
  <h3 id="pt"></h3><p id="pi"></p><div id="pc"></div>
  <label id="pl"><input type="checkbox" id="po"> OT / works this day</label>
  <input id="pn" placeholder="Note (e.g. cover by Joy)">
  <div class="act"><button id="px">Close</button><button id="ps" class="pri">Save</button></div><p id="pe"></p>
</div></div>
<script>
(function(){"use strict";
const API="https://script.google.com/macros/s/AKfycbxHq_Yypk7q31CbWDPQpGNweg5a5tF88K2oPZ6y7h2lofaFgJIVmmv47Vcq3T1JjTbW/exec";
const Q=new URLSearchParams(location.search),EDIT=Q.get("edit")==="1",EMBED=Q.get("embed")==="1",WANT=(Q.get("nick")||"").trim().toLowerCase();
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"],DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const COLORS={H:"#6d9eeb",PH:"#ff9900",PL:"#00d84a",AL:"#00c8d8",SL:"#e040c8",OC:"#f2d600"};
const NAMES={H:"Holiday",PH:"Public Holiday",PL:"Personal Leave",AL:"Annual Leave",SL:"Sick Leave",OC:"Office Close"};
const $=id=>document.getElementById(id),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now=new Date();let Y=now.getFullYear()===2027?2027:2026,M=Y===now.getFullYear()?now.getMonth():0,data=null,legend={},sel=null,scrolled=false;
const col=c=>legend[c]||COLORS[c]||"#999";
const chip=(c,ot)=>'<span class="chip" style="--c:'+col(c)+'">'+c+(ot?'<i>OT</i>':'')+'</span>';
function who(s){const m=/^(.*?)\s*\(([^)]+)\)\s*-?\s*(\S*)/.exec(s)||[];return{full:(m[1]||s).trim(),nick:(m[2]||s).trim(),pos:(m[3]||"").replace(/\d+$/,"")}}

function render(){
  $("ttl").textContent=MON[M]+" "+Y;
  if(!data)return;
  const cur=now.getFullYear()===Y&&now.getMonth()===M,td=now.getDate(),f=$("q").value.trim().toLowerCase();
  let h='<table class="'+(EDIT?"ed":"vw")+'"><thead><tr><th class="nm">Team</th>'+data.days.map(d=>'<th class="'+(d.dow%6===0?"we ":"")+(cur&&d.n===td?"tc":"")+'"><b>'+d.n+'</b><span>'+DOW[d.dow]+'</span></th>').join("")+'</tr></thead><tbody>';
  data.staff.forEach((s,si)=>{
    const w=who(s.name);if(f&&(w.nick+" "+w.full).toLowerCase().indexOf(f)<0)return;
    h+='<tr'+(w.nick.toLowerCase()===WANT?' class="me" id="me"':'')+'><td class="nm" title="'+esc(w.full)+'"><div class="who"><div class="av">'+esc(w.nick.charAt(0).toUpperCase())+'</div><div><b>'+esc(w.nick)+'</b><small>'+esc(w.pos||w.full)+'</small></div></div></td>';
    s.cells.forEach((c,i)=>{
      const x=c.code?chip(c.code,c.ot):(c.ot?'<span class="chip ot">OT</span>':'');
      h+='<td class="c'+(data.days[i].dow%6===0?" we":"")+(cur&&data.days[i].n===td?" tc":"")+(c.note?" nt":"")+((x||c.note)?" has":"")+'" data-s="'+si+'" data-i="'+i+'"'+(c.note?' title="'+esc(c.note)+'"':'')+'>'+x+'</td>';
    });h+='</tr>';
  });
  $("grid").innerHTML=h+'</tbody></table>';
  const offs=cur?data.staff.map(s=>({w:who(s.name),c:s.cells[td-1]})).filter(x=>x.c&&x.c.code):[];
  $("off").innerHTML=offs.length?'<span class="lb">Today</span>'+offs.map(x=>'<span>'+esc(x.w.nick)+' · '+(NAMES[x.c.code]||x.c.code)+'</span>').join(""):"";
  const ev=(data.events||[]).map((e,i)=>e?'<span><b>'+DOW[data.days[i].dow]+' '+data.days[i].n+'</b> · '+esc(e)+'</span>':"").join("");
  $("ev").innerHTML=ev?'<span class="lb">Events</span>'+ev:"";
  $("leg").innerHTML=Object.keys(NAMES).map(c=>'<span>'+chip(c)+NAMES[c]+'</span>').join("")+'<span><span class="chip ot">OT</span>Overtime / works that day</span>';
  if(!scrolled&&$("me")){scrolled=true;$("me").scrollIntoView({block:"nearest"});}
  const t=$("grid").querySelector("th.tc");if(cur&&t)$("grid").scrollLeft=Math.max(0,t.offsetLeft-200);
}
async function load(){
  $("grid").innerHTML='<p class="msg">Loading…</p>';render();
  try{
    const r=await fetch(API+"?action=month&year="+Y+"&month="+(M+1)),j=await r.json();
    if(j.error)throw new Error(j.error);
    if(Y!==2026&&j.year!==Y)throw new Error("The schedule script needs the 2027 update first.");
    data=j;legend=j.legend||{};render();
  }catch(e){data=null;$("grid").innerHTML='<p class="msg">Couldn’t load the schedule: '+esc(e.message)+'</p>';$("ev").innerHTML=$("off").innerHTML="";}
}
function go(d){M+=d;if(M<0){M=11;Y--;}if(M>11){M=0;Y++;}if(Y<2026){Y=2026;M=0;}if(Y>2027){Y=2027;M=11;}sync();load();}
function sync(){$("mo").value=M;$("yr").value=Y;}

/* ---- click a cell: staff see details, BM/ABM (?edit=1) can change it ---- */
const getKey=()=>{try{return sessionStorage.getItem("wsKey")||""}catch(e){return""}},setKey=k=>{try{sessionStorage.setItem("wsKey",k)}catch(e){}};
function open(si,i){
  const s=data.staff[si],c=s.cells[i];if(!EDIT&&!(c.code||c.ot||c.note))return;
  sel={si:si,i:i,code:c.code||""};
  $("pt").textContent=who(s.name).nick+" · "+DOW[data.days[i].dow]+" "+data.days[i].n+" "+MON[M];
  ["pc","pl","pn","ps"].forEach(id=>$(id).style.display=EDIT?"":"none");$("pi").style.display=EDIT?"none":"";
  $("pi").innerHTML=(c.code?chip(c.code,c.ot)+" "+(NAMES[c.code]||c.code):(c.ot?"Works overtime":"Working day"))+(c.note?'<br><small>Note: '+esc(c.note)+'</small>':"");
  $("pc").innerHTML='<button data-c="">None</button>'+Object.keys(NAMES).map(k=>'<button data-c="'+k+'" style="--c:'+col(k)+'">'+chip(k)+'</button>').join("");
  $("po").checked=!!c.ot;$("pn").value=c.note||"";$("pe").textContent="";mark();$("ov").hidden=false;
}
function mark(){$("pc").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.c===sel.code));}
async function save(){
  let key=getKey()||prompt("Passcode to edit the schedule:");if(!key)return;
  const s=data.staff[sel.si],c=s.cells[sel.i];$("ps").disabled=true;$("pe").textContent="";
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"setCell",key:key,year:Y,month:M+1,row:s.row,day:data.days[sel.i].n,code:sel.code,ot:$("po").checked,note:$("pn").value.trim()})}),j=await r.json();
    if(j.error){if(/passcode/i.test(j.error))setKey("");throw new Error(j.error);}
    setKey(key);c.code=sel.code;c.ot=$("po").checked;c.note=$("pn").value.trim();$("ov").hidden=true;render();
  }catch(e){$("pe").textContent="Couldn’t save: "+e.message;}
  $("ps").disabled=false;
}
/* ---- init ---- */
$("mo").innerHTML=MON.map((m,i)=>'<option value="'+i+'">'+m+'</option>').join("");sync();
$("mo").onchange=()=>{M=+$("mo").value;load();};$("yr").onchange=()=>{Y=+$("yr").value;load();};
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("tod").onclick=()=>{Y=now.getFullYear()===2027?2027:2026;M=now.getMonth();scrolled=false;sync();load();};
$("q").oninput=render;
$("grid").addEventListener("click",e=>{const t=e.target.closest("td.c");if(t&&data)open(+t.dataset.s,+t.dataset.i);});
$("pc").addEventListener("click",e=>{const b=e.target.closest("button");if(b){sel.code=b.dataset.c;mark();}});
$("px").onclick=()=>{$("ov").hidden=true;};$("ps").onclick=save;
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))$("ov").hidden=true;});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("ov").hidden=true;});
if(EMBED){$("hd").style.display="none";document.querySelector("main").style.padding="0";if(window.parent!==window)new ResizeObserver(()=>parent.postMessage({scheduleHeight:document.documentElement.scrollHeight},"*")).observe(document.body);}
load();
})();
</script></body></html>
